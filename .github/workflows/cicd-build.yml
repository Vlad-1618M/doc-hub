# Build Docker images and run the integration pipeline inside the tests-ci service.
# Uses committed cfgs/.env.ci (cfgs/.env is gitignored for local secrets).

name: Docker Compose CI

on:
  push:
    branches: [main, master, repo_init, v.tools_main]
  pull_request:
    branches: [main, master, repo_init, v.tools_main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose --env-file cfgs/.env.ci -f build/docker-compose-github.yml -p doc-hub-ci config --quiet

      - name: Build and run tests-ci (propagates exit code)
        run: |
          set -euo pipefail
          docker compose --env-file cfgs/.env.ci -f build/docker-compose-github.yml -p doc-hub-ci \
            up --build --abort-on-container-exit --exit-code-from tests-ci \
            doc-hub-mongo doc-hub-api tests-ci

      - name: Compose down
        if: always()
        run: |
          docker compose --env-file cfgs/.env.ci -f build/docker-compose-github.yml -p doc-hub-ci down -v --remove-orphans || true
