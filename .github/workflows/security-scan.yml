# Secret leak detection on the default branch and PRs.

name: Security scan

on:
  push:
    branches: [main, master, repo_init, v.tools_main]
  pull_request:
    branches: [main, master, repo_init, v.tools_main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
