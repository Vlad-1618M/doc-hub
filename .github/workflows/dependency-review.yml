# Flags vulnerable dependencies on pull requests (GitHub Dependency graph).

name: Dependency review

on:
  pull_request:
    branches: [main, master, repo_init, v.tools_main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v5
