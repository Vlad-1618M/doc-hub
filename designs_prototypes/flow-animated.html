<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Flow — Animated</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .flow-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 2rem;
    }
    .node {
      padding: 1rem 1.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 0.9rem;
      position: relative;
    }
    .node.user { border-color: #38bdf8; }
    .node.ui { border-color: #34d399; }
    .node.api { border-color: #a78bfa; }
    .node.db { border-color: #f472b6; }
    .connector {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      animation: moveDot 1.5s ease-in-out infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes moveDot {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }
    .arrow-line {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #38bdf8, #34d399);
      position: relative;
      overflow: hidden;
    }
    .arrow-line::after {
      content: '';
      position: absolute;
      right: -4px;
      top: -3px;
      border: 4px solid transparent;
      border-left-color: #34d399;
    }
    .arrow-line .shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 2s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 150%; }
    }
  </style>
</head>
<body>
  <div class="flow-container">
    <span class="node user">User</span>
    <div class="connector">
      <div class="arrow-line"><span class="shimmer"></span></div>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <span class="node ui">React UI</span>
    <div class="connector">
      <div class="arrow-line"><span class="shimmer"></span></div>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <span class="node api">FastAPI</span>
    <div class="connector">
      <div class="arrow-line"><span class="shimmer"></span></div>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <span class="node db">MongoDB</span>
  </div>
</body>
</html>
