<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — Resume Portal (Light)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0369a1;
      --accent-dim: #0284c7;
      --input-bg: #f8fafc;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 50%, #f8fafc 100%);
      color: var(--text);
      padding: 1.5rem;
    }
    .theme-links {
      position: fixed;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      z-index: 10;
    }
    .theme-links .nav-left { display: flex; gap: 0.5rem; }
    .theme-links .nav-right { display: flex; gap: 0.5rem; }
    .theme-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8125rem;
      padding: 0.375rem 0.625rem;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .theme-links a:hover { color: var(--accent); background: #e0f2fe; }
    .theme-links a.active { color: var(--accent); font-weight: 600; }
    .theme-links a.home-link { font-weight: 500; }
    .card {
      width: 100%;
      max-width: 28rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    }
    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.5rem;
      color: white;
    }
    .card h1 {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .card .subtitle {
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.375rem;
    }
    .form-group label .optional { color: var(--muted); font-weight: 400; }
    .form-group input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9375rem;
    }
    .form-group input::placeholder { color: var(--muted); }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(3,105,161,0.15);
    }
    .form-group .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .btn {
      width: 100%;
      padding: 0.75rem 1.25rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .signin-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .signin-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .signin-link a:hover { text-decoration: underline; }
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .footer p { margin-bottom: 0.25rem; }
    .footer a {
      color: var(--muted);
      text-decoration: none;
    }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <nav class="theme-links">
    <div class="nav-left">
      <a href="theme-light.html" class="home-link">← Return to home</a>
    </div>
    <div class="nav-right">
      <a href="register-v1.html">v1 Dark</a>
      <a href="register-v2.html" class="active">v2 Light</a>
      <a href="register-v3.html">v3 Terracotta</a>
    </div>
  </nav>

  <div class="card">
    <div class="logo">DP</div>
    <h1>Create account</h1>
    <p class="subtitle">Get started with Resume Portal</p>

    <form>
      <div class="form-group">
        <label>Name <span class="optional">(optional)</span></label>
        <input type="text" placeholder="Jane Smith" autocomplete="name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="you@company.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" autocomplete="new-password" />
        <p class="hint">At least 8 characters</p>
      </div>
      <div class="form-group">
        <label>Confirm password</label>
        <input type="password" placeholder="••••••••" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn">Create account</button>
    </form>

    <p class="signin-link">Already have an account? <a href="theme-light.html">Sign in</a></p>
  </div>

  <footer class="footer">
    <p>Doc Portal · Secure internal records</p>
    <p>© 2026 Doc Portal</p>
    <p>
      <a href="mailto:dev@company.com">Contact dev team</a> ·
      <a href="mailto:admin@company.com">Contact admin</a> ·
      <a href="mailto:devops@company.com">DevOps team</a> ·
      <a href="mailto:hr@company.com">HR</a> ·
      <a href="mailto:test@company.com">Test team</a> ·
      <a href="mailto:management@company.com">Management</a> ·
      <a href="#">Data</a>
    </p>
  </footer>
</body>
</html>
